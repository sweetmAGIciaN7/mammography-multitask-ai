experiment:
  name: multitask_baseline
  seed: 42

data:
  image_size: 224
  batch_size: 16
  split:
    train: 0.64
    validation: 0.16
    test: 0.20
  stratify_by: assessment_target

model:
  backbone: efficientnet_b0
  pretrained: true
  tasks:
    assessment:
      type: categorical
      num_classes: 5
    density:
      type: categorical
      num_classes: 4

training:
  stage_1:
    epochs: 4
    learning_rate: 0.0001
    weight_decay: 0.01
    freeze_backbone: true

  stage_2:
    epochs: 3
    learning_rate: 0.00005
    weight_decay: 0.005
    freeze_backbone: false